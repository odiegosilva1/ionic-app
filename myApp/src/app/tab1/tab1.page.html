<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-no-padding">
      <div class="logo-wrap">
        <div class="logo-title">Vida De Pet</div>
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" aria-label="Sair">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="ion-padding">
    <div class="welcome-msg" *ngIf="userName">
      Olá, <strong>{{ userName }}</strong>! Este é o <strong>{{ petNomeSaudacao }}</strong>
    </div>

    <ng-container *ngIf="petDestaque">
      <div class="pet-profile">
        <div class="pet-photo" (click)="goToPet(petDestaque)">
          <ion-avatar class="pet-photo-avatar" *ngIf="petDestaque.foto">
            <img [src]="petDestaque.foto" alt="{{ petDestaque.nome }}" />
          </ion-avatar>
          <div class="pet-photo-avatar pet-photo-icon" *ngIf="!petDestaque.foto">
            <ion-icon [name]="getEspecieIcon(petDestaque.especie)"></ion-icon>
          </div>
        </div>
        <h2 class="pet-name">{{ petDestaque.nome }}</h2>

        <div class="pet-infos">
          <div class="info-item">
            <ion-icon [name]="getEspecieIcon(petDestaque.especie)"></ion-icon>
            <span>{{ petDestaque.especie | titlecase }}</span>
          </div>
          <div class="info-item" *ngIf="petDestaque.raca">
            <ion-icon name="ribbon-outline"></ion-icon>
            <span>{{ petDestaque.raca }}</span>
          </div>
          <div class="info-item" *ngIf="petDestaque.idade !== null && petDestaque.idade !== undefined">
            <ion-icon name="calendar-outline"></ion-icon>
            <span>{{ petDestaque.idade }} anos</span>
          </div>
          <div class="info-item" *ngIf="petDestaque.peso !== null && petDestaque.peso !== undefined">
            <ion-icon name="scale-outline"></ion-icon>
            <span>{{ petDestaque.peso }} kg</span>
          </div>
        </div>
      </div>
    </ng-container>

    <div *ngIf="meusPets.length === 0" class="empty-state">
      <ion-icon name="paw-outline"></ion-icon>
      <h3>Você ainda não possui pets</h3>
      <p>Cadastre seu primeiro pet para começar.</p>
      <ion-button expand="block" (click)="novoPet()">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        Cadastrar Pet
      </ion-button>
    </div>
  </div>
</ion-content>
