<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-no-padding">
      <div class="logo-wrap">
        <div class="logo-title">Vida De Pet</div>
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" aria-label="Sair">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="ion-padding">
    <div class="welcome-msg" *ngIf="userName">
      Olá, <strong>{{ userName }}</strong>! Este é o <strong>{{ petNomeSaudacao }}</strong>
    </div>

    <div class="section-title" *ngIf="meusPets.length > 0">
      <h2>Meus pets</h2>
    </div>

    <ion-list class="pet-list" *ngIf="meusPets.length > 0">
      <ion-item (click)="goToPet(pet)" button *ngFor="let pet of meusPets">
        <ion-avatar slot="start" class="pet-avatar" *ngIf="pet.foto">
          <img [src]="pet.foto" alt="{{ pet.nome }}" />
        </ion-avatar>
        <div slot="start" class="pet-avatar-icon" *ngIf="!pet.foto">
          <ion-icon [name]="getEspecieIcon(pet.especie)"></ion-icon>
        </div>
        <ion-label>
          <h2>{{ pet.nome }}</h2>
          <p>{{ pet.especie | titlecase }}{{ pet.raca ? ' - ' + pet.raca : '' }}</p>
          <p *ngIf="pet.idade !== null && pet.idade !== undefined">Idade: {{ pet.idade }} anos</p>
          <p *ngIf="pet.peso !== null && pet.peso !== undefined">Peso: {{ pet.peso }} kg</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>
    </ion-list>

    <div *ngIf="meusPets.length === 0" class="empty-state">
      <ion-icon name="paw-outline"></ion-icon>
      <h3>Você ainda não possui pets</h3>
      <p>Cadastre seu primeiro pet para começar.</p>
      <ion-button expand="block" (click)="novoPet()">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        Cadastrar Pet
      </ion-button>
    </div>
  </div>
</ion-content>
