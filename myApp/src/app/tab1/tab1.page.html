<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-no-padding">
      <div class="logo-wrap">
        <img src="assets/icon/logo-pet.png" alt="Logo PetShop" />
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" class="ion-no-padding">
        <div class="logo-wrap">
          <img src="assets/icon/logo-pet.png" alt="Logo PetShop" />
        </div>
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Resumo</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="stats-container">
          <div class="stat-item" (click)="goToClientes()">
            <ion-icon name="people-outline"></ion-icon>
            <div class="stat-info">
              <span class="stat-number">{{ totalClientes }}</span>
              <span class="stat-label">Clientes</span>
            </div>
          </div>

          <div class="stat-item" (click)="goToPets()">
            <ion-icon name="paw-outline"></ion-icon>
            <div class="stat-info">
              <span class="stat-number">{{ totalPets }}</span>
              <span class="stat-label">Pets</span>
            </div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Acesso Rapido</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" (click)="goToClientes()">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Cadastrar Cliente
        </ion-button>
        <ion-button expand="block" (click)="goToPets()">
          <ion-icon name="add-circle-outline" slot="start"></ion-icon>
          Cadastrar Pet
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
