<ion-header>
  <ion-toolbar>
    <ion-title>Clientes</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="onSearch()"
      placeholder="Buscar clientes..."
      debounce="300"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="meu-perfil" *ngIf="meuPerfil">
    <ion-card color="primary" (click)="editMeuPerfil()" button>
      <ion-card-header>
        <ion-card-subtitle>Meu Perfil</ion-card-subtitle>
        <ion-card-title>{{ meuPerfil.nome }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p *ngIf="meuPerfil.email">{{ meuPerfil.email }}</p>
        <p *ngIf="meuPerfil.telefone">{{ meuPerfil.telefone }}</p>
        <p *ngIf="!meuPerfil.telefone && !meuPerfil.endereco" class="ion-text-italic">Toque para completar seu perfil</p>
        <div class="perfil-action">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-list *ngIf="clientes.length > 0">
    <ion-list-header>
      <ion-label color="medium">Outros Clientes</ion-label>
    </ion-list-header>
    <ion-item-sliding *ngFor="let cliente of clientes">
      <ion-item (click)="goToForm(cliente)" button>
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ cliente.nome }}</h2>
          <p *ngIf="cliente.telefone">{{ cliente.telefone }}</p>
          <p *ngIf="cliente.email" class="ion-text-wrap">{{ cliente.email }}</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="onDelete(cliente)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-list *ngIf="clientes.length === 0 && !meuPerfil">
    <ion-item>
      <ion-label class="ion-text-center">
        <p>Nenhum cliente encontrado</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="goToForm()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
