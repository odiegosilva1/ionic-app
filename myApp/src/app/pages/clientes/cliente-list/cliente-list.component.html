<ion-header>
  <ion-toolbar>
    <ion-title>Clientes</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="onSearch()"
      placeholder="Buscar clientes..."
      debounce="300"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="clientes.length > 0">
    <ion-item-sliding *ngFor="let cliente of clientes">
      <ion-item (click)="goToForm(cliente)" button>
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ cliente.nome }}</h2>
          <p *ngIf="cliente.telefone">{{ cliente.telefone }}</p>
          <p *ngIf="cliente.email" class="ion-text-wrap">{{ cliente.email }}</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="onDelete(cliente)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-list *ngIf="clientes.length === 0">
    <ion-item>
      <ion-label class="ion-text-center">
        <p>Nenhum cliente encontrado</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="goToForm()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
