<ion-header>
  <ion-toolbar>
    <ion-title>Ranking de Tutores</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="onSearch()"
      placeholder="Buscar tutor ou pet..."
      debounce="300"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list class="crud-list ranking-list" *ngIf="ranking.length > 0">
    <ion-item-sliding *ngFor="let item of ranking">
      <ion-item (click)="goToForm(item.cliente)" button>
        <div slot="start" class="rank-badge" [class.top]="item.posicao <= 3">
          <span class="rank-position">{{ posicaoLabel(item.posicao) }}</span>
        </div>
        <ion-label>
          <h2 class="rank-name">{{ item.cliente.nome }}</h2>
          <div class="rank-pets">
            <div class="rank-pet" *ngFor="let pet of item.pets" (click)="goToPet(pet); $event.stopPropagation()">
              <ion-avatar class="pet-avatar" *ngIf="pet.foto">
                <img [src]="pet.foto" alt="{{ pet.nome }}" />
              </ion-avatar>
              <div class="pet-avatar pet-avatar-icon" *ngIf="!pet.foto">
                <ion-icon [name]="getEspecieIcon(pet.especie)"></ion-icon>
              </div>
              <span class="pet-name">{{ pet.nome }}</span>
            </div>
            <div class="rank-pet empty" *ngIf="item.pets.length === 0">
              <span class="pet-name">Sem pets</span>
            </div>
          </div>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="onDelete(item.cliente)" aria-label="Excluir tutor">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-list *ngIf="ranking.length === 0">
    <ion-item>
      <ion-label class="ion-text-center">
        <p>Nenhum tutor encontrado</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="goToForm()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
