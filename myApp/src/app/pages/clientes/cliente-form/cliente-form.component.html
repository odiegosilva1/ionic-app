<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="onCancel()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Editar Cliente' : 'Novo Cliente' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onSubmit()" strong [disabled]="loading">Salvar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #form="ngForm" (ngSubmit)="onSubmit()">
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Nome *</ion-label>
        <ion-input
          [(ngModel)]="cliente.nome"
          name="nome"
          placeholder="Nome do cliente"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Telefone</ion-label>
        <ion-input
          [(ngModel)]="cliente.telefone"
          name="telefone"
          type="tel"
          placeholder="(00) 00000-0000"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input
          [(ngModel)]="cliente.email"
          name="email"
          type="email"
          placeholder="email@exemplo.com"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Endereço</ion-label>
        <ion-textarea
          [(ngModel)]="cliente.endereco"
          name="endereco"
          placeholder="Endereço completo"
          rows="3"
        ></ion-textarea>
      </ion-item>
    </ion-list>
  </form>
</ion-content>
