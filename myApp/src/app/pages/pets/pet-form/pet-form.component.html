<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="onCancel()" aria-label="Fechar">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Editar Pet' : '' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onSubmit()" strong [disabled]="loading">Salvar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #form="ngForm" (ngSubmit)="onSubmit()">
    <div class="pet-photo" (click)="selectFoto()" role="button" tabindex="0" aria-label="Alterar foto do pet">
      <ion-avatar class="pet-avatar">
        <img *ngIf="fotoPreview" [src]="fotoPreview" alt="Foto do pet" />
        <div *ngIf="!fotoPreview" class="avatar-placeholder">
          <ion-icon name="camera"></ion-icon>
        </div>
      </ion-avatar>
      <ion-text class="photo-hint">
        <small>{{ fotoPreview ? 'Toque para trocar/remover a foto' : 'Toque para adicionar a foto do pet' }}</small>
      </ion-text>
    </div>

    <ion-list>
      <ion-item>
        <ion-label position="stacked">Nome</ion-label>
        <ion-input
          [(ngModel)]="pet.nome"
          name="nome"
          placeholder="Nome do pet"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Espécie</ion-label>
        <ion-select
          [(ngModel)]="pet.especie"
          name="especie"
          placeholder="Selecione a espécie"
          interface="popover"
        >
          <ion-select-option *ngFor="let especie of especies" [value]="especie.value">
            {{ especie.label }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Raça</ion-label>
        <ion-input
          [(ngModel)]="pet.raca"
          name="raca"
          placeholder="Raça do pet"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Idade (anos)</ion-label>
        <ion-input
          [(ngModel)]="pet.idade"
          name="idade"
          type="number"
          min="0"
          max="50"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Peso (kg)</ion-label>
        <ion-input
          [(ngModel)]="pet.peso"
          name="peso"
          type="number"
          min="0"
          step="0.1"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Tutor</ion-label>
        <ion-select
          [(ngModel)]="pet.cliente_id"
          name="cliente_id"
          placeholder="Selecione o tutor"
          interface="popover"
          required
        >
          <ion-select-option *ngFor="let cliente of clientes" [value]="cliente.id">
            {{ cliente.id === meuPerfilId ? 'Eu (' + cliente.nome + ')' : cliente.nome }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>
  </form>
</ion-content>
