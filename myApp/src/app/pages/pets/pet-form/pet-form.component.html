<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="onCancel()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Editar Pet' : 'Novo Pet' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onSubmit()" strong>Salvar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form #form="ngForm" (ngSubmit)="onSubmit()">
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Nome *</ion-label>
        <ion-input
          [(ngModel)]="pet.nome"
          name="nome"
          placeholder="Nome do pet"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Especie *</ion-label>
        <ion-select
          [(ngModel)]="pet.especie"
          name="especie"
          placeholder="Selecione a especie"
          interface="popover"
        >
          <ion-select-option *ngFor="let especie of especies" [value]="especie.value">
            {{ especie.label }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Raca</ion-label>
        <ion-input
          [(ngModel)]="pet.raca"
          name="raca"
          placeholder="Raca do pet"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Idade (anos)</ion-label>
        <ion-input
          [(ngModel)]="pet.idade"
          name="idade"
          type="number"
          min="0"
          max="50"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Peso (kg)</ion-label>
        <ion-input
          [(ngModel)]="pet.peso"
          name="peso"
          type="number"
          min="0"
          step="0.1"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Tutor *</ion-label>
        <ion-select
          [(ngModel)]="pet.cliente_id"
          name="cliente_id"
          placeholder="Selecione o tutor"
          interface="popover"
          required
        >
          <ion-select-option *ngFor="let cliente of clientes" [value]="cliente.id">
            {{ cliente.id === meuPerfilId ? 'Eu (' + cliente.nome + ')' : cliente.nome }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>
  </form>
</ion-content>
