<ion-header>
  <ion-toolbar>
    <ion-title>Pets</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="onSearch()"
      placeholder="Buscar pets..."
      debounce="300"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list class="crud-list" *ngIf="pets.length > 0">
    <ion-item-sliding *ngFor="let pet of pets">
      <ion-item (click)="goToForm(pet)" button>
        <ion-avatar slot="start" class="pet-avatar" *ngIf="pet.foto">
          <img [src]="pet.foto" alt="{{ pet.nome }}" />
        </ion-avatar>
        <div slot="start" class="pet-avatar-icon" *ngIf="!pet.foto">
          <ion-icon [name]="getEspecieIcon(pet.especie)"></ion-icon>
        </div>
        <ion-label>
          <h2>{{ pet.nome }}</h2>
          <p>{{ pet.especie | titlecase }} - {{ pet.raca }}</p>
          <p *ngIf="pet.tutor_nome" class="tutor">Tutor: {{ pet.tutor_nome }}</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="onDelete(pet)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-list *ngIf="pets.length === 0">
    <ion-item>
      <ion-label class="ion-text-center">
        <p>Nenhum pet encontrado</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="goToForm()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
