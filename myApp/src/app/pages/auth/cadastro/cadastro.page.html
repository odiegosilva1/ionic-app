<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/login">Voltar</ion-button>
    </ion-buttons>
    <ion-title>Cadastro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="cadastro-container">
    <div class="logo-section">
      <ion-icon name="person-add-outline" class="logo-icon"></ion-icon>
      <h1>Criar Conta</h1>
      <p>Preencha seus dados para se cadastrar</p>
    </div>

    <form (ngSubmit)="onRegister()">
      <ion-list>
        <ion-item>
          <ion-label position="stacked">Nome *</ion-label>
          <ion-input
            [(ngModel)]="nome"
            name="nome"
            placeholder="Seu nome completo"
            required
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Email *</ion-label>
          <ion-input
            [(ngModel)]="email"
            name="email"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
            (ionBlur)="emailTouched = true"
            required
          ></ion-input>
        </ion-item>
        <ion-text color="danger" class="error-text" *ngIf="emailTouched && email.length > 0 && !isEmailValid">
          <ion-icon name="alert-circle-outline"></ion-icon>
          Formato de email inválido
        </ion-text>
      </ion-list>

      <div class="password-rules" *ngIf="senha.length > 0">
        <div class="strength-bar">
          <div class="strength-fill" [style.width.%]="(passwordStrength / 5) * 100" [class]="'bg-' + strengthColor"></div>
        </div>
        <span class="strength-label" [class]="'text-' + strengthColor">{{ strengthLabel }}</span>

        <ul class="rules-list">
          <li *ngFor="let rule of rules" [class.met]="ruleMet(rule)">
            <ion-icon [name]="ruleMet(rule) ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
            {{ rule.label }}
          </li>
        </ul>
      </div>

      <ion-list>
        <ion-item>
          <ion-label position="stacked">Confirmar Senha *</ion-label>
          <ion-input
            [(ngModel)]="confirmarSenha"
            name="confirmarSenha"
            type="password"
            placeholder="Repita a senha"
            autocomplete="new-password"
            required
          ></ion-input>
        </ion-item>
      </ion-list>

      <ion-button expand="block" type="submit" class="register-btn">
        Cadastrar
      </ion-button>
    </form>

    <div class="login-link">
      <p>Já tem conta? <a routerLink="/login">Faça login</a></p>
    </div>
  </div>
</ion-content>
