<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/login">Voltar</ion-button>
    </ion-buttons>
    <ion-title>Redefinir Senha</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">
    <div class="auth-logo-section">
      <ion-icon name="lock-closed-outline" class="logo-icon"></ion-icon>
      <h1>Nova Senha</h1>
      <p>Defina uma nova senha para sua conta</p>
    </div>

    <ng-container *ngIf="!concluido; else concluidoMsg">
      <form (ngSubmit)="onSubmit()">
        <ion-list>
          <ion-item>
            <ion-label position="stacked">Nova Senha *</ion-label>
            <ion-input
              [(ngModel)]="senha"
              name="senha"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Mínimo 8 caracteres"
            ></ion-input>
            <ion-button slot="end" fill="clear" (click)="showPassword = !showPassword" class="eye-btn">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-item>
        </ion-list>

        <div class="password-rules" *ngIf="senha.length > 0">
          <div class="strength-bar">
            <div class="strength-fill" [style.width.%]="(passwordStrength / 5) * 100" [class]="'bg-' + strengthColor"></div>
          </div>
          <span class="strength-label" [class]="'text-' + strengthColor">{{ strengthLabel }}</span>

          <ul class="rules-list">
            <li *ngFor="let rule of rules" [class.met]="ruleMet(rule)">
              <ion-icon [name]="ruleMet(rule) ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
              {{ rule.label }}
            </li>
          </ul>
        </div>

        <ion-list>
          <ion-item>
            <ion-label position="stacked">Confirmar Nova Senha *</ion-label>
            <ion-input
              [(ngModel)]="confirmarSenha"
              name="confirmarSenha"
              [type]="showConfirmPassword ? 'text' : 'password'"
              placeholder="Repita a nova senha"
            ></ion-input>
            <ion-button slot="end" fill="clear" (click)="showConfirmPassword = !showConfirmPassword" class="eye-btn">
              <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-item>
        </ion-list>

        <ion-button expand="block" type="submit" class="submit-btn auth-submit-btn" [disabled]="loading">
          <ion-spinner name="crescent" *ngIf="loading"></ion-spinner>
          <span *ngIf="!loading">Redefinir senha</span>
        </ion-button>
      </form>
    </ng-container>

    <ng-template #concluidoMsg>
      <div class="sucesso-box">
        <ion-icon name="checkmark-circle" class="sucesso-icon"></ion-icon>
        <h2>Senha redefinida!</h2>
        <p>Sua senha foi alterada com sucesso. Faça login com a nova senha.</p>
        <ion-button expand="block" routerLink="/login" class="submit-btn primary-btn">Ir para o login</ion-button>
      </div>
    </ng-template>
  </div>
</ion-content>
