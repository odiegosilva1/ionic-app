<ion-header>
  <ion-toolbar>
    <ion-title>Entrar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-section">
      <ion-icon name="paw-outline" class="logo-icon"></ion-icon>
      <h1>PetShop</h1>
      <p>Faça login para continuar</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <ion-list>
        <ion-item>
          <ion-label position="stacked">Email</ion-label>
          <ion-input
            [(ngModel)]="email"
            name="email"
            placeholder="seu@email.com"
            (ionBlur)="emailTouched = true"
          ></ion-input>
        </ion-item>
        <ion-text color="danger" class="error-text" *ngIf="emailTouched && email.length > 0 && !isEmailValid">
          <ion-icon name="alert-circle-outline"></ion-icon>
          Formato de email inválido
        </ion-text>

        <ion-item>
          <ion-label position="stacked">Senha</ion-label>
          <ion-input
            [(ngModel)]="senha"
            name="senha"
            type="password"
            placeholder="Sua senha"
          ></ion-input>
        </ion-item>
      </ion-list>

      <ion-button expand="block" type="submit" class="login-btn">
        Entrar
      </ion-button>
    </form>

    <div class="register-link">
      <p>Não tem conta? <a routerLink="/cadastro">Cadastre-se</a></p>
    </div>
  </div>
</ion-content>
