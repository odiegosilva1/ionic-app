<ion-content class="ion-padding">
  <div class="auth-container">
    <div class="auth-logo-section">
      <ion-icon name="paw-outline" class="logo-icon"></ion-icon>
      <h1>Vida De Pet</h1>
      <p>Faça login para continuar</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <ion-list>
        <ion-item>
          <ion-label position="stacked">Email</ion-label>
          <ion-input
            [(ngModel)]="email"
            name="email"
            placeholder="seu@email.com"
            (ionBlur)="emailTouched = true"
          ></ion-input>
        </ion-item>
        <ion-text color="danger" class="error-text" *ngIf="emailTouched && email.length > 0 && !isEmailValid">
          <ion-icon name="alert-circle-outline"></ion-icon>
          Formato de email inválido
        </ion-text>

        <ion-item>
          <ion-label position="stacked">Senha</ion-label>
          <ion-input
            [(ngModel)]="senha"
            name="senha"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Sua senha"
          ></ion-input>
          <ion-button slot="end" fill="clear" (click)="showPassword = !showPassword" class="eye-btn">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-list>

      <ion-button expand="block" type="submit" class="login-btn auth-submit-btn" [disabled]="loading">
        <ion-spinner name="crescent" *ngIf="loading"></ion-spinner>
        <span *ngIf="!loading">Entrar</span>
      </ion-button>
    </form>

    <div class="forgot-link">
      <a routerLink="/esqueci-senha">Esqueci a senha?</a>
    </div>

    <div class="register-link">
      <p>Não tem conta? <a routerLink="/cadastro">Cadastre-se</a></p>
    </div>
  </div>

  <div class="footer-brand">
    <span>© 2026 Vida De Pet™</span>
    <span>Versão 0.0.1</span>
  </div>
</ion-content>
